<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Skill Olympus v6 system overview</title>
  <desc id="desc">Claude Code, Codex, Antigravity, and Grok are integrated runtimes. OpenClaw and Hermes Agent receive portable skills only. One request enters the Zeus delivery harness and moves through planning, native implementation, inspection, runtime preparation, testing, and an evidence report. Chronos supplies persistence and Mnemo supplies memory across the workflow.</desc>
  <defs>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#e6bd32" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#e6bd32"/>
      <stop offset="1" stop-color="#e6bd32" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f4f2ec" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .sans { font-family: "DM Sans", "Pretendard", "Noto Sans", Arial, sans-serif; }
      .serif { font-family: "Fraunces", "Hahmlet", Georgia, serif; }
      .mono { font-family: "IBM Plex Mono", "JetBrains Mono", Consolas, monospace; }
      .eyebrow { fill: #a7a8b0; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
      .label { fill: #f4f2ec; font-size: 17px; font-weight: 650; }
      .small { fill: #a7a8b0; font-size: 12px; }
      .phase { fill: #f4f2ec; font-size: 16px; font-weight: 650; }
      .phase-sub { fill: #a7a8b0; font-size: 11px; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#0d0e12"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="664" rx="6" fill="none" stroke="#30323a"/>
  <g transform="translate(70 62)">
    <text class="mono eyebrow" x="0" y="0">SKILL OLYMPUS / V6.0.0</text>
    <text class="serif" x="0" y="46" fill="#f4f2ec" font-size="38" font-weight="600">One workflow system. Six runtime surfaces.</text>
    <text class="sans" x="0" y="76" fill="#a7a8b0" font-size="15">Integrated where the runtime contract is verified; portable skills everywhere else.</text>
  </g>
  <g transform="translate(70 180)">
    <text class="mono eyebrow" x="0" y="0">INTEGRATED RUNTIMES</text>
    <g transform="translate(0 18)"><rect width="185" height="56" rx="3" fill="#15171d" stroke="#494b54"/><rect x="12" y="13" width="4" height="30" fill="#e6bd32"/><text class="sans label" x="30" y="35">Claude Code</text></g>
    <g transform="translate(197 18)"><rect width="150" height="56" rx="3" fill="#15171d" stroke="#494b54"/><rect x="12" y="13" width="4" height="30" fill="#e6bd32"/><text class="sans label" x="30" y="35">Codex CLI</text></g>
    <g transform="translate(359 18)"><rect width="195" height="56" rx="3" fill="#15171d" stroke="#494b54"/><rect x="12" y="13" width="4" height="30" fill="#e6bd32"/><text class="sans label" x="30" y="35">Antigravity</text></g>
    <g transform="translate(566 18)"><rect width="155" height="56" rx="3" fill="#15171d" stroke="#494b54"/><rect x="12" y="13" width="4" height="30" fill="#e6bd32"/><text class="sans label" x="30" y="35">Grok Build</text></g>
  </g>
  <g transform="translate(842 180)">
    <text class="mono eyebrow" x="0" y="0">SKILLS-ONLY HOSTS</text>
    <rect x="0" y="18" width="288" height="56" rx="3" fill="#111319" stroke="#30323a" stroke-dasharray="5 5"/>
    <text class="sans label" x="18" y="52">OpenClaw</text><line x1="130" y1="31" x2="130" y2="61" stroke="#30323a"/><text class="sans label" x="148" y="52">Hermes Agent</text>
  </g>
  <g transform="translate(70 286)">
    <rect width="1060" height="230" rx="6" fill="#111319" stroke="#30323a" filter="url(#shadow)"/>
    <text class="mono eyebrow" x="24" y="33">ZEUS / DELIVERY HARNESS</text>
    <text class="sans small" x="1036" y="33" text-anchor="end">one request → evidence-backed result</text>
    <path d="M 52 112 H 1008" stroke="url(#rail)" stroke-width="3"/><polygon points="1008,112 995,105 995,119" fill="#e6bd32"/>
    <g transform="translate(32 68)"><rect width="148" height="90" rx="3" fill="#181a21" stroke="#4a4c55"/><text class="mono" x="14" y="20" fill="#e6bd32" font-size="10">01</text><text class="sans phase" x="14" y="49">Plan</text><text class="mono phase-sub" x="14" y="70">ZEPHERMINE</text></g>
    <g transform="translate(202 68)"><rect width="148" height="90" rx="3" fill="#181a21" stroke="#4a4c55"/><text class="mono" x="14" y="20" fill="#e6bd32" font-size="10">02</text><text class="sans phase" x="14" y="49">Build</text><text class="mono phase-sub" x="14" y="70">NATIVE WORKERS</text></g>
    <g transform="translate(372 68)"><rect width="148" height="90" rx="3" fill="#181a21" stroke="#4a4c55"/><text class="mono" x="14" y="20" fill="#e6bd32" font-size="10">03</text><text class="sans phase" x="14" y="49">Inspect</text><text class="mono phase-sub" x="14" y="70">ARGOS</text></g>
    <g transform="translate(542 68)"><rect width="148" height="90" rx="3" fill="#181a21" stroke="#4a4c55"/><text class="mono" x="14" y="20" fill="#e6bd32" font-size="10">04</text><text class="sans phase" x="14" y="49">Run</text><text class="mono phase-sub" x="14" y="70">DOCKER</text></g>
    <g transform="translate(712 68)"><rect width="148" height="90" rx="3" fill="#181a21" stroke="#4a4c55"/><text class="mono" x="14" y="20" fill="#e6bd32" font-size="10">05</text><text class="sans phase" x="14" y="49">Test</text><text class="mono phase-sub" x="14" y="70">MINOS</text></g>
    <g transform="translate(882 68)"><rect width="148" height="90" rx="3" fill="#e6bd32" stroke="#e6bd32"/><text class="mono" x="14" y="20" fill="#17181d" font-size="10">06</text><text class="sans" x="14" y="49" fill="#17181d" font-size="16" font-weight="750">Report</text><text class="mono" x="14" y="70" fill="#37301a" font-size="11">EVIDENCE</text></g>
    <text class="sans small" x="32" y="194">18 active entry points route into 76 source-only modules only when needed.</text>
    <text class="sans small" x="1028" y="194" text-anchor="end">0 custom agents registered by default</text>
  </g>
  <g transform="translate(70 548)">
    <rect width="1060" height="54" rx="3" fill="#15171d" stroke="#494b54"/><rect width="10" height="54" rx="2" fill="#e6bd32"/>
    <text class="serif" x="30" y="34" fill="#f4f2ec" font-size="21" font-weight="600">Chronos</text><text class="mono eyebrow" x="152" y="33">PERSISTENCE RAIL</text><text class="sans small" x="1032" y="33" text-anchor="end">keep working until external evidence satisfies the completion contract</text>
  </g>
  <g transform="translate(70 614)">
    <rect width="1060" height="54" rx="3" fill="#15171d" stroke="#494b54"/><rect width="10" height="54" rx="2" fill="#f4f2ec"/>
    <text class="serif" x="30" y="34" fill="#f4f2ec" font-size="21" font-weight="600">Mnemo</text><text class="mono eyebrow" x="142" y="33">MEMORY RAIL</text><text class="sans small" x="1032" y="33" text-anchor="end">preserve decisions, conversations, evidence, and handoff state across sessions</text>
  </g>
</svg>
